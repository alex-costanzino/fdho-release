log: True
net:
  model_name: oscillator
  in_features: 3
  oscillator:
    omega: 45.0
    omega_n: 50.0
    xi: 0.707
    phi: 0.0
    learn_params: True
    lr_linear: 1e-4
    lr_physics: 1e-2
    hidden_features: 256
    hidden_layers: 5
  siren:
    omega_0: 30.0
    hidden_features: 256
    hidden_layers: 5
    lr: 1e-4
  gaussian:
    sigma: 0.1
    hidden_features: 256
    hidden_layers: 5
    lr: 1e-4
  wire:
    omega_0: 10.0
    scale: 40.0
    hidden_features: 256
    hidden_layers: 2
    lr: 5e-3
  bacon:
    frequency_limit: 2048
    quantize_freq: True
    hidden_features: 128
    hidden_layers: 6
    lr: 1e-4
  finer:
    first_omega_0: 30.0 
    hidden_omega_0: 30.0 
    first_bias_scale: None
    scale_req_grad: False
    hidden_features: 256
    hidden_layers: 3
    lr: 1e-4
  mfn:
    weight_scale: 16.0
    alpha: 2.5
    hidden_features: 256
    hidden_layers: 3
    lr: 1e-2
  fourier_features:
    scale: 10.0
    hidden_features: 256
    hidden_layers: 4
    lr: 1e-3
  fr:
    high_freq_num: 256
    hidden_features: 256
    hidden_layers: 2
    lr: 5e-3
train:
  # steps: 200000
  steps: 50000
  accum_steps: 2
  use_amp: false
data:
  # Produced by scripts/download_sdf_data.sh followed by scripts/prepare_sdf_data.py.
  sdf_path: data/sdf/thai_statue.xyz
  # sdf_path: data/sdf/armadillo.xyz
  # sdf_path: data/sdf/dragon.xyz
  # sdf_path: data/sdf/lucy.xyz
  on_surface_samples: 125000
  resolution : 512